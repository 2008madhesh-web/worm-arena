<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Worm Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0f1a;--panel:rgba(255,255,255,.12);--text:#e8ecf5}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 10px);font-size:14px;opacity:.85;pointer-events:none}
#boost{position:fixed;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:84px;height:84px;border-radius:50%;background:var(--panel);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.5px;user-select:none;-webkit-user-select:none;touch-action:none}
#boost.on{background:rgba(255,200,60,.5)}
#over{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;text-align:center;background:rgba(5,7,13,.78)}
#over h2{margin:0 0 6px;font-size:32px}
#home{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);background:radial-gradient(ellipse at 50% 30%,rgba(61,245,160,.14),rgba(5,7,13,.82) 70%);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#home .card{width:min(92vw,360px);display:flex;flex-direction:column;gap:14px;text-align:center}
.logo{font-size:clamp(40px,12vw,56px);font-weight:900;letter-spacing:2px;line-height:1;background:linear-gradient(90deg,#3df5a0,#38bdf8,#c084fc,#3df5a0);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite;filter:drop-shadow(0 0 18px rgba(61,245,160,.45))}
.logo span{display:block;font-size:.62em;letter-spacing:10px;margin-top:4px}
@keyframes flow{to{background-position:300% 0}}
.tag{opacity:.7;letter-spacing:3px;font-size:12px;text-transform:uppercase;margin-bottom:6px}
#home input{width:100%;box-sizing:border-box;padding:14px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:var(--text);font-size:16px;text-align:center;outline:none}
#home input:focus{border-color:#3df5a0;box-shadow:0 0 0 3px rgba(61,245,160,.2)}
#home .codein{letter-spacing:10px;font-weight:800;text-transform:uppercase;font-size:22px}
.pane{display:none;flex-direction:column;gap:12px}.pane.on{display:flex}
.row{display:flex;gap:12px}.row .b{flex:1}
.b{padding:14px;border-radius:18px;font-size:16px;font-weight:800;letter-spacing:1px;color:var(--text);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);cursor:pointer}
.b:active{transform:scale(.97)}
.b.play{padding:18px;font-size:22px;color:#06210f;border:0;background:linear-gradient(135deg,#3df5a0,#38bdf8);box-shadow:0 0 28px rgba(61,245,160,.5);animation:pulse 2s ease-in-out infinite}
.b.ghost{background:none;border-color:transparent;opacity:.7}
@keyframes pulse{50%{box-shadow:0 0 46px rgba(56,189,248,.75)}}
.code{font-size:44px;font-weight:900;letter-spacing:12px;padding-left:12px;color:#3df5a0;text-shadow:0 0 18px rgba(61,245,160,.6)}
.lbl,.foot{font-size:12px;opacity:.6;letter-spacing:1px}
#over button{margin-top:14px;padding:12px 28px;border:0;border-radius:24px;background:#3df5a0;color:#06210f;font-size:16px;font-weight:700}
#lb{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 108px);font-size:12px;text-align:right;opacity:.85;pointer-events:none;line-height:1.5;display:none}
body,button,input{font-family:"Rajdhani",system-ui,sans-serif}
.logo,.b,.code,.codein,#boost,#over h2,.lbl{font-family:"Orbitron",system-ui,sans-serif}
.lbl{font-size:11px;letter-spacing:2px}
.b{font-size:13px;letter-spacing:1.5px}
.b.play{font-size:20px}
#boost{font-size:14px}
button,.b,#boost{transition:transform .15s ease,box-shadow .2s ease,background .2s ease,filter .2s ease;-webkit-tap-highlight-color:transparent}
@media(hover:hover){.b:hover,#over button:hover{transform:translateY(-2px);filter:brightness(1.15)}}
.b:active,#over button:active,#boost:active{transform:scale(.94)}
#boost.on{transform:scale(.92)}
.pane.on{animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
#over>div{animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
.seg .b.on{background:linear-gradient(135deg,#3df5a0,#38bdf8);color:#06210f;border-color:transparent}
.plist{display:flex;flex-direction:column;gap:6px;max-height:30vh;overflow:auto}
.plist>div{display:flex;justify-content:space-between;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.08);animation:rise .25s ease both}
#gear{position:fixed;z-index:8;top:calc(env(safe-area-inset-top,0px) + 40px);left:12px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:var(--panel);color:var(--text);display:flex;align-items:center;justify-content:center;padding:0}
#gear:active{transform:rotate(60deg) scale(.92)}
@media(hover:hover){#gear:hover{transform:rotate(45deg)}}
#set{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(5,7,13,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#set .card{width:min(90vw,340px);padding:22px;border-radius:22px;background:rgba(20,26,44,.96);border:1px solid rgba(255,255,255,.15);display:flex;flex-direction:column;gap:16px;animation:pop .3s cubic-bezier(.2,1.4,.4,1) both}
#set h3{margin:0;font-family:"Orbitron",system-ui,sans-serif;letter-spacing:3px;text-align:center;font-size:18px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:18px}
.sw{position:relative;flex:none;width:50px;height:28px;border-radius:14px;border:0;padding:0;background:rgba(255,255,255,.18)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s ease}
.sw.on{background:#3df5a0}.sw.on::after{transform:translateX(22px)}
.b.danger{background:rgba(255,77,109,.16);border-color:rgba(255,77,109,.6);color:#ff8fa3}
.b.danger.sure{background:#ff4d6d;color:#fff}
body.br #boost{left:auto;right:22px}

/* ---- redesign: underground ---- */
:root{--bg:#1a100c;--text:#f6e7d8;--pink:#ff8fa3;--teal:#5ef2d6}
body,button,input,.lbl{font-family:"Bricolage Grotesque",system-ui,sans-serif}
.logo,.b,.code,.codein,#boost,#over h2,#set h3{font-family:"Bagel Fat One","Bricolage Grotesque",sans-serif;font-weight:400}
#home{background:#1a100c;backdrop-filter:none;-webkit-backdrop-filter:none;overflow-y:auto;align-items:flex-start}
#home .card{margin:auto;position:relative;z-index:2;padding:20px 0}
#scene,#fx{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#fx{z-index:1}
.logo{background:none;color:var(--pink);animation:none;filter:none;letter-spacing:0;font-size:clamp(48px,15vw,66px);line-height:1;text-shadow:0 4px 0 #8a3447,0 0 30px rgba(255,143,163,.4)}
.logo i{display:inline-block;font-style:normal}
.logo span{display:block;font-size:1em;letter-spacing:0;margin:0}
.tag{text-transform:none;letter-spacing:0;font-size:16px;opacity:.85}
#home input{border-radius:22px 18px 24px 16px/18px 24px 16px 22px;background:rgba(0,0,0,.4);border:2px solid #5a3a2a;box-shadow:inset 0 3px 8px rgba(0,0,0,.5)}
#home input:focus{border-color:var(--teal);box-shadow:inset 0 3px 8px rgba(0,0,0,.5),0 0 0 3px rgba(94,242,214,.25)}
.b{border-radius:26px 20px 28px 18px/20px 28px 18px 26px;background:linear-gradient(#5f3d2b,#3d2519);border:0;color:var(--text);letter-spacing:.5px;font-size:16px;box-shadow:0 4px 0 #1f120c,inset 0 2px 0 rgba(255,255,255,.14)}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 #1f120c}
.b.play{color:#4a0f1f;font-size:26px;background:repeating-linear-gradient(90deg,#ff8fa3 0 15px,#ee6f89 15px 19px);box-shadow:0 5px 0 #8a3447,0 0 34px rgba(255,143,163,.35);animation:none}
.b.ghost{background:none;box-shadow:none;opacity:.75}
.seg .b.on{background:linear-gradient(#5ef2d6,#32bfa3);color:#08332a}
.code{color:var(--teal);text-shadow:0 0 18px rgba(94,242,214,.6)}
.lbl,.foot{letter-spacing:0;text-transform:none;font-size:14px;opacity:.75}
.plist>div{background:rgba(0,0,0,.35);border-radius:14px 10px 14px 10px}
.sw.on{background:var(--teal)}
#over button{background:var(--pink);color:#4a0f1f}
#set .card{background:#2a1a12;border-color:#5a3a2a}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="home"><canvas id="scene"></canvas><canvas id="fx"></canvas><div class="card">
<div class="logo" id="logo"></div>
<div class="tag">Eat. Grow. Outlast.</div>
<input id="nick" maxlength="14" placeholder="Nickname" autocomplete="off">
<div id="p-main" class="pane on">
<button class="b play" id="bPlay">Play</button>
<div class="row"><button class="b" id="bCreate">Create room</button><button class="b" id="bJoin">Join room</button></div>
</div>
<div id="p-create" class="pane">
<div class="lbl">Room mode</div>
<div class="row seg"><button class="b on" id="rOn">Respawn on</button><button class="b" id="rOff">Last standing</button></div>
<div class="lbl" id="modeDesc" style="line-height:1.6"></div>
<button class="b play" id="bMake">Create</button><button class="b ghost" data-back>Back</button>
</div>
<div id="p-lobby" class="pane">
<div class="lbl">Room code</div><div id="code" class="code">----</div>
<div class="lbl" id="lmode"></div>
<div id="plist" class="plist"></div>
<button class="b play" id="bStart">Start</button><div id="wait" class="lbl">Waiting for the host to start...</div><button class="b ghost" id="bLeave">Leave</button>
</div>
<div id="p-join" class="pane">
<input id="jcode" class="codein" maxlength="4" placeholder="CODE" autocomplete="off">
<button class="b play" id="bGo">Join</button><button class="b ghost" data-back>Back</button>
</div>
<div id="err" class="lbl" style="color:#ff8fa3;min-height:14px"></div>
<div id="top" class="lbl" style="line-height:1.6"></div>
</div></div>
<button id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M20 7h0M4 12h4M14 12h6M4 17h10M20 17h0"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="16" cy="17" r="2"/></svg></button>
<div id="set"><div class="card"><h3>Settings</h3>
<div class="opt"><span>Boost button on right</span><button class="sw" data-k="right" aria-label="Boost button on right"></button></div>
<div class="opt"><span>Minimap</span><button class="sw" data-k="map" aria-label="Minimap"></button></div>
<div class="opt"><span>Player names</span><button class="sw" data-k="names" aria-label="Player names"></button></div>
<div class="opt"><span>Performance mode</span><button class="sw" data-k="perf" aria-label="Performance mode"></button></div>
<button class="b danger" id="bQuit">Quit match</button>
<button class="b" id="bClose">Close</button>
</div></div>
<div id="lb"></div>
<div id="hud" style="display:none">Length <b id="len">0</b> · Kills <b id="kills">0</b> · Drag to steer · Hold BOOST<span id="room"></span></div>
<div id="boost" style="display:none">BOOST</div>
<div id="over"><div><h2 id="ot">You died</h2><div id="od"></div><div id="ob" class="lbl" style="line-height:1.8;margin-top:8px"></div><button id="again">Play again</button> <button id="menu" style="background:var(--panel);color:var(--text)">Menu</button></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const S=Object.assign({right:false,map:true,names:true,perf:false},(()=>{try{return JSON.parse(localStorage.getItem('wa')||'{}')}catch{return{}}})());
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),over=$('over');
const sock=io();
let R=2500,W,H,dpr,myId=0,myName='',home=true,joy=null,tgt=0,boost=false;
const worms=new Map(),food=new Map();let me={x:0,y:0,l:0},lb=[],mm=[];
function resize(){dpr=S.perf?1:Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr}
addEventListener('resize',resize);resize();

// ---------- Network ----------
sock.on('connect',()=>{$('err').textContent='';if(home){sock.emit('watch');loadTop()}});
sock.on('disconnect',()=>{inLobby=false;home=true;worms.clear();over.style.display='none';setHud(false);$('home').style.display='flex';pane('main');$('err').textContent='Connection lost. Reconnecting...'});
sock.on('dead',d=>{$('ot').textContent='You were eliminated';$('od').textContent=(d.by?'Killed by '+d.by:'Eliminated')+' \u00b7 Length '+d.len;$('ob').textContent=d.respawn?'':'Waiting for the match to end...';$('again').style.display=d.respawn?'':'none';over.style.display='flex'});
sock.on('over',d=>{const won=d.winId===myId;$('ot').textContent=won?'VICTORY':(d.winner?d.winner+' wins':'Draw');$('od').textContent=won?'Last one standing':'Match over';$('ob').innerHTML='KILLS \u00b7 LENGTH<br>'+d.board.map((r,i)=>`${i+1}. ${esc(r[0])} \u00b7 ${r[1]} \u00b7 ${r[2]}`).join('<br>');$('again').style.display='none';over.style.display='flex'});
sock.on('lobby',l=>renderLobby(l));
sock.on('start',()=>{inLobby=false;worms.clear();joy=null;boost=false;home=false;$('home').style.display='none';over.style.display='none';setHud(true)});
sock.on('state',s=>{
  me=s.me;lb=s.lb;mm=s.m;
  for(const f of s.fa)food.set(f[0],f);
  for(const id of s.fr)food.delete(id);
  const seen=new Set();
  for(const w of s.w){
    seen.add(w.i);const n=w.s.length/2;let o=worms.get(w.i);
    if(!o){o={segs:[]};worms.set(w.i,o);for(let k=0;k<n;k++)o.segs.push({x:w.s[2*k],y:w.s[2*k+1]})}
    o.t=w.s;o.n=w.n;o.h=w.h;o.r=w.r;
    while(o.segs.length<n){const l=o.segs[o.segs.length-1]||{x:w.s[0],y:w.s[1]};o.segs.push({x:l.x,y:l.y})}
    o.segs.length=n;
  }
  for(const id of worms.keys())if(!seen.has(id))worms.delete(id);
});
setInterval(()=>{if(!home&&sock.connected)sock.volatile.emit('input',{a:tgt,b:boost})},50);

// ---------- Home screen ----------
function setHud(v){$('hud').style.display=v?'block':'none';$('boost').style.display=v?'flex':'none';$('lb').style.display=v?'block':'none'}
function pane(n){for(const p of document.querySelectorAll('.pane'))p.classList.toggle('on',p.id==='p-'+n)}
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function loadTop(){fetch('/api/leaderboard').then(r=>r.json()).then(a=>{
  $('top').innerHTML=a.length?'Top players<br>'+a.slice(0,5).map((r,i)=>`${i+1}. ${esc(r.name)} \u00b7 ${r.score}`).join('<br>'):''}).catch(()=>{})}
let inLobby=false,lobby=null,rsp=true;
function renderLobby(l){
  if(!inLobby)return;lobby=l;
  $('code').textContent=l.code;$('lmode').textContent=l.respawn?'Respawn on \u00b7 endless':'Last one standing';
  $('plist').innerHTML=l.players.map(p=>`<div><span>${esc(p.n)}</span><span style="opacity:.6">${p.id===l.host?'HOST':''}</span></div>`).join('');
  const host=l.host===myId;$('bStart').style.display=host?'':'none';$('wait').style.display=host?'none':'';
}
function enter(room){
  myName=$('nick').value.trim()||'Player';$('err').textContent='';
  sock.emit('join',{name:myName,room},res=>{
    if(!res||!res.ok){$('err').textContent=(res&&res.err)||'Could not join';return}
    R=res.R;myId=res.id;food.clear();worms.clear();for(const f of res.f)food.set(f[0],f);
    joy=null;boost=false;over.style.display='none';
    $('room').textContent=res.code==='PUBLIC'?'':' \u00b7 Room '+res.code;
    if(res.lobby){inLobby=true;renderLobby({code:res.code,host:res.host,respawn:res.respawn,players:res.players});pane('lobby')}
    else{home=false;$('home').style.display='none';setHud(true)}
  });
}
function sel(){$('rOn').classList.toggle('on',rsp);$('rOff').classList.toggle('on',!rsp);$('modeDesc').textContent=rsp?'Players keep respawning. The match never ends.':'No respawns. The last worm alive wins.'}
$('bPlay').onclick=()=>enter('PUBLIC');
$('bCreate').onclick=()=>{rsp=true;sel();pane('create')};
$('rOn').onclick=()=>{rsp=true;sel()};$('rOff').onclick=()=>{rsp=false;sel()};
$('bMake').onclick=()=>sock.emit('create',{respawn:rsp},res=>{if(res&&res.ok)enter(res.code);else $('err').textContent=(res&&res.err)||'Could not create room'});
$('bStart').onclick=()=>sock.emit('start',null,res=>{if(res&&!res.ok)$('err').textContent=res.err});
$('bLeave').onclick=()=>{sock.emit('watch');inLobby=false;$('err').textContent='';pane('main')};
$('bJoin').onclick=()=>pane('join');
$('bGo').onclick=()=>{const c=$('jcode').value.trim().toUpperCase();if(c.length===4)enter(c);else $('jcode').focus()};
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>pane('main'));
$('again').onclick=()=>{over.style.display='none';sock.emit('respawn')};
$('menu').onclick=()=>{over.style.display='none';sock.emit('watch');inLobby=false;worms.clear();home=true;myId=0;setHud(false);$('home').style.display='flex';pane('main');loadTop()};

// ---------- Input: floating joystick on touch, cursor on mouse, boost button/space ----------
const boostEl=$('boost');
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'){steer(e);boost=true;return}
  if(!joy)joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY};
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){steer(e);return}
  if(joy&&joy.id===e.pointerId){joy.x=e.clientX;joy.y=e.clientY;
    const dx=joy.x-joy.ox,dy=joy.y-joy.oy;if(Math.hypot(dx,dy)>8)tgt=Math.atan2(dy,dx)}
});
const end=e=>{if(e.pointerType==='mouse')boost=false;else if(joy&&joy.id===e.pointerId)joy=null};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
function steer(e){tgt=Math.atan2(e.clientY-H/2,e.clientX-W/2)}
const bo=v=>e=>{e.preventDefault();boost=v;boostEl.classList.toggle('on',v)};
boostEl.addEventListener('pointerdown',bo(true));boostEl.addEventListener('pointerup',bo(false));boostEl.addEventListener('pointercancel',bo(false));
addEventListener('keydown',e=>{if(e.code==='Space'&&!home&&document.activeElement.tagName!=='INPUT')boost=true});
addEventListener('keyup',e=>{if(e.code==='Space')boost=false});

// ---------- Home scene ----------
const wv=(t,o)=>[...t].map((c,i)=>`<i style="transform:translateY(${Math.round(Math.sin((i+o)*1.1)*7)}px) rotate(${Math.round(Math.cos((i+o)*1.1)*5)}deg)">${c}</i>`).join('');
$('logo').innerHTML=wv('Worm',0)+'<span>'+wv('Arena',3)+'</span>';
const sc=$('scene'),sx=sc.getContext('2d'),fx=$('fx'),fc=fx.getContext('2d');let sw=0,sh=0;
const SP=Array.from({length:36},()=>({x:Math.random(),y:Math.random(),r:1+Math.random()*2.5,v:.6+Math.random(),p:Math.random()*6}));
function buildScene(){
  const d=S.perf?1:Math.min(devicePixelRatio||1,2),P=Math.PI;sw=innerWidth;sh=innerHeight;
  sc.width=sw*d;sc.height=sh*d;fx.width=sw;fx.height=sh;sx.setTransform(d,0,0,d,0,0);
  const sy=Math.max(56,sh*.09),g=sx.createLinearGradient(0,0,0,sy);g.addColorStop(0,'#2b1b3d');g.addColorStop(1,'#8a4457');sx.fillStyle=g;sx.fillRect(0,0,sw,sy+6);
  ['#4a2e1f','#3a2318','#2c1a12','#21130d','#180d09'].forEach((c,k)=>{const y0=sy+(sh-sy)*k/5;sx.fillStyle=c;sx.beginPath();sx.moveTo(0,sh);sx.lineTo(0,y0);for(let x=0;x<=sw;x+=16)sx.lineTo(x,y0+Math.sin(x*.015+k*2)*9+Math.sin(x*.05+k)*4);sx.lineTo(sw,sh);sx.fill()});
  sx.fillStyle='#3f8f5a';for(let x=0;x<sw;x+=6){const h=8+Math.random()*12;sx.fillRect(x,sy-h+5,3,h)}
  sx.strokeStyle='#6b4630';sx.lineCap='round';sx.lineWidth=3;for(let i=0;i<7;i++){let x=Math.random()*sw,y=sy;sx.beginPath();sx.moveTo(x,y);for(let j=0;j<8;j++){x+=Math.random()*24-12;y+=14+Math.random()*10;sx.lineTo(x,y)}sx.stroke()}
  for(let i=0,n=S.perf?50:260;i<n;i++){const r=1+Math.random()*(i%9?2:7);sx.fillStyle=i%9?'rgba(255,220,180,.08)':'#5a3a2a';sx.beginPath();sx.ellipse(Math.random()*sw,sy+Math.random()*(sh-sy),r,r*.7,0,0,2*P);sx.fill()}
  sx.strokeStyle='rgba(246,231,216,.3)';sx.lineWidth=5;const fy=sh*.88,fxp=sw*.05;for(let i=0;i<5;i++){sx.beginPath();sx.arc(fxp+i*22,fy,26-i*2,P*1.1,P*1.9);sx.stroke()}sx.beginPath();sx.moveTo(fxp-12,fy-5);sx.lineTo(fxp+100,fy-5);sx.stroke();
  const cx=sw/2,cy=sh*.52,rg=sx.createRadialGradient(cx,cy,0,cx,cy,Math.max(sw*.8,sh*.6));rg.addColorStop(0,'rgba(10,5,4,.94)');rg.addColorStop(.5,'rgba(10,5,4,.82)');rg.addColorStop(1,'rgba(10,5,4,0)');sx.fillStyle=rg;sx.fillRect(0,sy,sw,sh);
  sx.shadowColor='#5ef2d6';sx.shadowBlur=S.perf?0:20;
  [[.1,.72,9],[.17,.77,6],[.9,.64,10],[.83,.72,6],[.94,.82,7],[.07,.46,6],[.92,.4,6]].forEach(([a,b,r],i)=>{const x=a*sw,y=b*sh;sx.fillStyle='#bff7ea';sx.fillRect(x-r*.25,y,r*.5,r*1.6);sx.fillStyle=i%2?'#5ef2d6':'#46c9ae';sx.beginPath();sx.arc(x,y,r,P,0);sx.fill()});
  sx.shadowBlur=0;
}
function sporesTick(now){fc.clearRect(0,0,sw,sh);if(S.perf)return;fc.globalCompositeOperation='lighter';
  for(const s of SP){s.y-=s.v*.0006;if(s.y<0)s.y=1;const x=s.x*sw+Math.sin(now/1500+s.p)*14,y=s.y*sh,a=.4+.4*Math.sin(now/600+s.p);
    fc.fillStyle=`rgba(94,242,214,${a*.22})`;fc.beginPath();fc.arc(x,y,s.r*4,0,6.283);fc.fill();fc.fillStyle=`rgba(190,255,240,${a})`;fc.beginPath();fc.arc(x,y,s.r,0,6.283);fc.fill()}}
addEventListener('resize',buildScene);
// ---------- Render ----------
function drawMap(z,cx,cy){
  ctx.fillStyle='#05070d';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-cx,-cy);
  ctx.beginPath();ctx.arc(0,0,R,0,6.283);if(S.perf)ctx.fillStyle='#10172a';else{const g=ctx.createRadialGradient(0,0,0,0,0,R);g.addColorStop(0,'#1d1830');g.addColorStop(1,'#0d1224');ctx.fillStyle=g}ctx.fill();
  ctx.save();ctx.clip();
  const g=S.perf?1e9:100,x0=Math.floor((cx-W/2/z)/g)*g,x1=cx+W/2/z,y0=Math.floor((cy-H/2/z)/g)*g,y1=cy+H/2/z;
  ctx.strokeStyle='rgba(120,150,255,.09)';ctx.lineWidth=2;ctx.beginPath();
  for(let x=x0;x<x1;x+=g){ctx.moveTo(x,y0);ctx.lineTo(x,y1)}
  for(let y=y0;y<y1;y+=g){ctx.moveTo(x0,y);ctx.lineTo(x1,y)}
  ctx.stroke();ctx.restore();
  ctx.lineWidth=14;ctx.strokeStyle='#ff4d6d';if(!S.perf){ctx.shadowColor='#ff4d6d';ctx.shadowBlur=40}ctx.beginPath();ctx.arc(0,0,R,0,6.283);ctx.stroke();ctx.shadowBlur=0;
}
function drawWorm(o){
  const r=o.r,s=o.segs;if(!s.length)return;
  const h=s[0],n=s[1]||h,a=Math.atan2(h.y-n.y,h.x-n.x);
  if(!S.perf){ctx.lineJoin=ctx.lineCap='round';ctx.beginPath();s.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.strokeStyle=`hsla(${o.h},90%,60%,.2)`;ctx.lineWidth=r*2.8;ctx.stroke()}
  for(let i=s.length-1;i>=0;i--){ctx.fillStyle=`hsl(${o.h},80%,${i%6<3?55:45}%)`;ctx.beginPath();ctx.arc(s[i].x,s[i].y,r,0,6.283);ctx.fill()}
  if(!S.perf){ctx.beginPath();s.forEach((q,i)=>i?ctx.lineTo(q.x-r*.25,q.y-r*.3):ctx.moveTo(q.x-r*.25,q.y-r*.3));ctx.strokeStyle=`hsla(${o.h},95%,88%,.28)`;ctx.lineWidth=r*.7;ctx.stroke()}
  let ta=a+Math.sin(last/700+o.h)*.9,bd=22500;
  for(const f of food.values()){const dx=f[1]-h.x,dy=f[2]-h.y,d=dx*dx+dy*dy;if(d<bd){bd=d;ta=Math.atan2(dy,dx)}}
  o.la=o.la===undefined?a:o.la;o.la+=Math.atan2(Math.sin(ta-o.la),Math.cos(ta-o.la))*.15;
  for(const k of[-.6,.6]){
    const ex=h.x+Math.cos(a+k)*r*.6,ey=h.y+Math.sin(a+k)*r*.6;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,r*.3,0,6.283);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ex+Math.cos(o.la)*r*.13,ey+Math.sin(o.la)*r*.13,r*.15,0,6.283);ctx.fill();
  }
  if(S.names){ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='700 14px Rajdhani,system-ui';ctx.textAlign='center';ctx.fillText(o.n,h.x,h.y-r-8)}
}
function minimap(){if(!S.map)return;
  const s=44,mx=W-s-16,my=s+10+(parseFloat(getComputedStyle(document.documentElement).paddingTop)||0);
  ctx.fillStyle='rgba(255,255,255,.1)';ctx.beginPath();ctx.arc(mx,my,s,0,6.283);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.5)';for(const p of mm)ctx.fillRect(mx+p[0]/R*s-1.5,my+p[1]/R*s-1.5,3,3);
  if(!home){ctx.fillStyle='#3df5a0';ctx.beginPath();ctx.arc(mx+me.x/R*s,my+me.y/R*s,3.5,0,6.283);ctx.fill()}
}
function joystick(){
  if(!joy)return;
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(joy.ox,joy.oy,48,0,6.283);ctx.stroke();
  const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.min(Math.hypot(dx,dy),48),a=Math.atan2(dy,dx);
  ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.arc(joy.ox+Math.cos(a)*l,joy.oy+Math.sin(a)*l,22,0,6.283);ctx.fill();
}
// ---------- Settings ----------
function applyS(){
  document.body.classList.toggle('br',S.right);
  document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',!!S[b.dataset.k]));
  resize();buildScene();try{localStorage.setItem('wa',JSON.stringify(S))}catch{}
}
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{S[b.dataset.k]=!S[b.dataset.k];applyS()});
let qt=0;
function resetQuit(){const q=$('bQuit');q.classList.remove('sure');q.textContent='Quit match';clearTimeout(qt)}
$('gear').onclick=()=>{resetQuit();$('bQuit').style.display=(!home||inLobby)?'':'none';$('set').style.display='flex'};
$('bClose').onclick=()=>{$('set').style.display='none';resetQuit()};
$('bQuit').onclick=()=>{const q=$('bQuit');
  if(!q.classList.contains('sure')){q.classList.add('sure');q.textContent='Tap again to confirm';qt=setTimeout(resetQuit,3000);return}
  resetQuit();$('set').style.display='none';$('menu').onclick()};
applyS();
let last=performance.now(),cam={x:0,y:0},zoom=1,lbT=0;
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;if(home){sporesTick(now);requestAnimationFrame(frame);return}const k=Math.min(1,dt*18);
  for(const o of worms.values()){const t=o.t;for(let i=0;i<o.segs.length;i++){const s=o.segs[i];s.x+=(t[2*i]-s.x)*k;s.y+=(t[2*i+1]-s.y)*k}}
  const mine=worms.get(myId),ft=(!home&&mine&&mine.segs[0])||me,cr=home?2:10;
  cam.x+=(ft.x-cam.x)*Math.min(1,dt*cr);cam.y+=(ft.y-cam.y)*Math.min(1,dt*cr);
  zoom+=(Math.max(.6,1-(home?24:me.l)*.0012)-zoom)*dt*2;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawMap(zoom,cam.x,cam.y);
  const hw=W/2/zoom+20,hh=H/2/zoom+20;
  for(const f of food.values()){if(Math.abs(f[1]-cam.x)>hw||Math.abs(f[2]-cam.y)>hh)continue;
    let x=f[1],y=f[2],pu=0;const rd=f[3]>1?7:4.5;
    for(const o of worms.values()){const q=o.segs[0];if(!q)continue;const d=Math.hypot(q.x-x,q.y-y);if(d<90){const p=1-d/90;if(p>pu){pu=p;const m=p*p*.85;x+=(q.x-x)*m;y+=(q.y-y)*m}}}
    if(!S.perf){const t=now/500+f[0];y+=Math.sin(t)*1.6;ctx.globalCompositeOperation='lighter';
      ctx.fillStyle=`hsla(${f[4]},95%,60%,${.12+.05*Math.sin(t)+pu*.25})`;ctx.beginPath();ctx.arc(x,y,rd*(3.2+pu*1.5),0,6.283);ctx.fill();
      ctx.fillStyle=`hsla(${f[4]},95%,65%,${.25+pu*.3})`;ctx.beginPath();ctx.arc(x,y,rd*1.9,0,6.283);ctx.fill();ctx.globalCompositeOperation='source-over'}
    ctx.fillStyle=`hsl(${f[4]},90%,${S.perf?60:70}%)`;ctx.beginPath();ctx.arc(x,y,rd,0,6.283);ctx.fill()}
  for(const o of worms.values())drawWorm(o);
  ctx.restore();ctx.setTransform(dpr,0,0,dpr,0,0);
  minimap();joystick();
  $('len').textContent=me.l;$('kills').textContent=me.k||0;
  if(now-lbT>500){lbT=now;$('lb').innerHTML='<span style="opacity:.55">LENGTH \u00b7 KILLS</span><br>'+lb.map((r,i)=>`${i+1}. ${esc(r[0])} \u00b7 ${r[1]} \u00b7 ${r[2]}`).join('<br>')}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
